name: music card

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run this late; think "every 15-30 min", not live
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/music.py, .github/workflows/music.yml]

permissions:
  contents: write

concurrency:
  group: music
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render music.svg
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: python3 scripts/music.py --out dist/music.svg --theme dark --panel

      # The image lives on its own "output" branch that gets overwritten each run,
      # so main's history doesn't fill up with "update music" commits.
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.svg
          git commit -q -m "update music card"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
